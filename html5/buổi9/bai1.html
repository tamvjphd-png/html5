<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Responsive</title>

    <style>
        /* =========================
           1. RESET & CƠ BẢN
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* =========================
           2. LAYOUT CHÍNH
           Mobile: 1 cột
        ========================= */
        .dashboard {
            min-height: 100vh;

            display: grid;

            grid-template-columns: 1fr;
            grid-template-rows: auto 70px 1fr 50px;

            grid-template-areas:
                "sidebar"
                "header"
                "content"
                "footer";
        }

        /* =========================
           3. SIDEBAR
        ========================= */
        .sidebar {
            grid-area: sidebar;

            padding: 16px;

            background-color: #2c3e50;
            color: white;
        }

        .logo {
            margin-bottom: 10px;

            font-size: 18px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .menu a {
            padding: 6px 10px;

            color: white;
            text-decoration: none;
            font-size: 14px;

            border-radius: 6px;
        }

        .menu a:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* =========================
           4. HEADER
        ========================= */
        .header {
            grid-area: header;

            display: flex;
            flex-direction: column;
            justify-content: center;

            gap: 4px;

            padding: 0 20px;

            background-color: white;
            border-bottom: 1px solid #eee;
        }

        .header h1 {
            font-size: 1.2rem;
        }

        .welcome {
            color: #777;
            font-size: 13px;
        }

        /* =========================
           5. CONTENT
        ========================= */
        .content {
            grid-area: content;

            padding: 20px;

            background-color: #f5f6fa;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(140px, 1fr));

            gap: 12px;
        }

        .stat-card {
            padding: 16px;

            background-color: white;
            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .stat-number {
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .stat-title {
            margin-top: 4px;

            color: #777;
            font-size: 14px;
        }

        /* =========================
           6. FOOTER
        ========================= */
        .footer {
            grid-area: footer;

            display: flex;
            align-items: center;

            padding: 0 20px;

            background-color: #ecf0f1;
            color: #555;

            font-size: 13px;
        }

        /* =========================
           7. TABLET & DESKTOP
        ========================= */
        @media (min-width: 768px) {
            .dashboard {
                grid-template-columns: 220px 1fr;
                grid-template-rows: 70px 1fr 50px;

                grid-template-areas:
                    "sidebar header"
                    "sidebar content"
                    "sidebar footer";
            }

            .menu {
                flex-direction: column;
            }

            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">Admin</div>

            <nav class="menu">
                <a href="#">Tổng quan</a>
                <a href="#">Sản phẩm</a>
                <a href="#">Đơn hàng</a>
                <a href="#">Khách hàng</a>
            </nav>
        </aside>

        <!-- Header -->
        <header class="header">
            <h1>Tổng quan</h1>
            <span class="welcome">Xin chào, Admin</span>
        </header>

        <!-- Nội dung -->
        <main class="content">

            <div class="stats">

                <div class="stat-card">
                    <h2 class="stat-number">1.245</h2>
                    <p class="stat-title">Đơn hàng</p>
                </div>

                <div class="stat-card">
                    <h2 class="stat-number">328tr</h2>
                    <p class="stat-title">Doanh thu</p>
                </div>

                <div class="stat-card">
                    <h2 class="stat-number">89</h2>
                    <p class="stat-title">Khách hàng mới</p>
                </div>

            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            &copy; 2026 ShopABC Admin
        </footer>

    </div>

</body>

</html>
