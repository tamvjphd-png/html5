<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navbar & Banner Responsive</title>

    <style>
        /* =========================
           1. RESET & CƠ BẢN
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* =========================
           2. NAVBAR
        ========================= */
        .navbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;

            padding: 16px 24px;

            background-color: #2c3e50;
            color: white;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* Menu mobile */
        .nav-links {
            width: 100%;
            order: 3;

            display: flex;
            flex-direction: column;

            gap: 8px;
            margin-top: 12px;

            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Nút giỏ hàng */
        .cart-button {
            padding: 8px 16px;

            border: none;
            border-radius: 6px;

            background-color: #e74c3c;
            color: white;

            cursor: pointer;
        }

        .cart-button:hover {
            background-color: #c0392b;
        }

        /* =========================
           3. BANNER
        ========================= */
        .banner {
            min-height: 260px;
            height: 60vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            color: white;
            text-align: center;

            background:
                linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.2),
                    rgba(0, 0, 0, 0.6)),
                url("https://picsum.photos/id/180/1600/600");

            background-size: cover;
            background-position: center;
        }

        .banner h1 {
            margin-bottom: 10px;

            /*
                24px: kích thước nhỏ nhất
                5vw : kích thước linh hoạt
                56px: kích thước lớn nhất
            */
            font-size: clamp(24px, 5vw, 56px);
        }

        .banner p {
            font-size: clamp(14px, 2vw, 20px);
        }

        /* =========================
           4. CONTAINER
        ========================= */
        .container {
            width: min(92%, 1100px);

            margin: 0 auto;
            padding: 32px 0;
        }

        /* =========================
           5. PRODUCT GRID
        ========================= */
        .product-grid {
            display: flex;
            flex-wrap: wrap;

            gap: 16px;
        }

        .product-card {
            /*
                flex-grow: 1
                flex-shrink: 1
                flex-basis: 200px
            */
            flex: 1 1 200px;

            padding: 10px;

            border: 1px solid #eee;
            border-radius: 8px;

            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 160px;

            display: block;

            object-fit: cover;

            border-radius: 6px;
        }

        .product-name {
            margin-top: 10px;

            color: #333;
        }

        /* =========================
           6. TABLET & DESKTOP
        ========================= */
        @media (min-width: 768px) {

            .nav-links {
                width: auto;
                order: 0;

                flex-direction: row;

                gap: 20px;
                margin-top: 0;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header class="navbar">

        <div class="logo">
            ShopABC
        </div>

        <ul class="nav-links">
            <li>
                <a href="#">Trang chủ</a>
            </li>

            <li>
                <a href="#">Sản phẩm</a>
            </li>

            <li>
                <a href="#">Liên hệ</a>
            </li>
        </ul>

        <button class="cart-button">
            🛒 Giỏ hàng
        </button>

    </header>

    <!-- =========================
         BANNER
    ========================== -->
    <section class="banner">

        <h1>Ưu Đãi Mùa Hè</h1>

        <p>
            Giảm giá lên đến 50% cho tất cả sản phẩm
        </p>

    </section>

    <!-- =========================
         PRODUCTS
    ========================== -->
    <main class="container">

        <div class="product-grid">

            <article class="product-card">
                <img src="https://picsum.photos/id/21/300/400" alt="Áo thun trắng">

                <p class="product-name">
                    Áo thun trắng
                </p>
            </article>

            <article class="product-card">
                <img src="https://picsum.photos/id/103/400/250" alt="Giày sneaker">

                <p class="product-name">
                    Giày sneaker
                </p>
            </article>

            <article class="product-card">
                <img src="https://picsum.photos/id/28/500/300" alt="Quần jean">

                <p class="product-name">
                    Quần jean
                </p>
            </article>

        </div>

    </main>

</body>

</html>
